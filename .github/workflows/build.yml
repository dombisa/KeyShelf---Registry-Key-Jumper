name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 binutils-mingw-w64

      - name: Build
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: KeyShelfRegJumper
          path: |
            KeyShelfRegJumper_x64.exe
            KeyShelfRegJumper_x86.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: KeyShelfRegJumper

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha256sum KeyShelfRegJumper_x64.exe KeyShelfRegJumper_x86.exe > SHA256SUMS.txt
          NOTES="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            gh release create "$GITHUB_REF_NAME" KeyShelfRegJumper_x64.exe KeyShelfRegJumper_x86.exe SHA256SUMS.txt \
              --title "Key Shelf Reg Jumper ${GITHUB_REF_NAME}" --notes-file "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" KeyShelfRegJumper_x64.exe KeyShelfRegJumper_x86.exe SHA256SUMS.txt \
              --title "Key Shelf Reg Jumper ${GITHUB_REF_NAME}" --generate-notes
          fi
